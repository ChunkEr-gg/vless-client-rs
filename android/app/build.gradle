plugins {
    id 'com.android.application' version '8.13.2'
}
android {
    namespace 'io.vless.client'
    compileSdk 36
    defaultConfig {
        applicationId 'io.vless.client'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
tasks.register('checkEngine') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libvless_engine.so').isFile()) {
            throw new GradleException('Run android/build-engine.sh before assembling the app')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('checkEngine') }
