plugins {
    id 'com.android.application' version '8.13.2'
}
android {
    namespace 'io.vless.client'
    compileSdk 36
    defaultConfig {
        applicationId 'io.vless.client'
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        targetSdk 36
        versionCode = (System.getenv('RELEASE_CODE') ?: '1').toInteger()
        versionName = System.getenv('RELEASE_VERSION') ?: '0.1'
    }
    if (System.getenv('ANDROID_KEYSTORE_FILE')) {
        signingConfigs {
            distribution {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig = signingConfigs.distribution
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
tasks.register('checkEngine') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libvless_engine.so').isFile()) {
            throw new GradleException('Run android/build-engine.sh before assembling the app')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('checkEngine') }

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
