[package]
name = "vless-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vless_engine"
path = "src/lib.rs"

[[bin]]
name = "vless-engine"
path = "src/main.rs"

[dependencies]
vless-ipc = { path = "../ipc" }
async-trait = "0.1"
aws-lc-rs = { version = "1", default-features = false }
base64 = "0.22"
bytes = "1"
etherparse = "0.21"
futures = "0.3"
httparse = "1.10"
ipnetwork = { version = "0.21", features = ["serde"] }
libc = "0.2"
log = { version = "0.4", features = ["std", "release_max_level_info"] }
lru = "0.19"
memchr = "2"
parking_lot = "0.12.5"
rand = "0.10"
rustc-hash = "2"
rustls = "=0.23.46"
serde = { version = "1", features = ["derive", "std"] }
serde_json = "1"
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "auto-icmp-echo-reply",
    "socket-udp",
    "socket-tcp",
    "socket-tcp-cubic",
    "phy-tuntap_interface",
    "assembler-max-segment-count-32",
    "segmentation-offload",
] }
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["time", "io", "rt"] }
uuid = "1"
zeroize = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
webpki-roots = "1"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1", features = ["fallback"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = "0.26"
