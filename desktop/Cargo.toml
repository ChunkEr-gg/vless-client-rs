[package]
name = "vless-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard","default_fonts","glow","wayland","x11"] }
vless-profile = { path = "../profile" }
tokio = { version = "1", features = ["rt","process","time","sync","net","io-util","macros"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
form_urlencoded = "1"
percent-encoding = "2"
rustls-pki-types = "1"
uuid = "1"
directories = "6"
