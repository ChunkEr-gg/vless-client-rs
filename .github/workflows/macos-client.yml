name: macOS client

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'push' || github.ref_type == 'tag' || github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and sign the release bundle
        run: ./dist/package-app.sh --build
      - name: Verify kernel utun lifetime and packet delivery
        run: |
          set -o pipefail
          test_binary=$(cargo test --locked --release -p vless-tray-helper --test macos_utun \
            --no-run --message-format=json | jq -ser 'map(select(.target.name == "macos_utun" and .target.kind == ["test"])) | .[0].executable // error("missing macos_utun test binary")')
          sudo -n "$test_binary" --ignored --test-threads=1
      - name: Transfer HTTP through the native utun and pinned VLESS engine
        run: |
          set -o pipefail
          test_binary=$(cargo test --locked --release -p vless-tray --test full_stack_e2e \
            --no-run --message-format=json | jq -ser 'map(select(.target.name == "full_stack_e2e" and .target.kind == ["test"])) | .[0].executable // error("missing full_stack_e2e test binary")')
          sudo -n "$test_binary" --ignored --exact native_utun_http_transfer_through_pinned_vless
      - name: Verify the packaged executables and signature
        run: |
          app="target/dist/VLESS Tray.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/vless-tray" --version
          "$app/Contents/MacOS/vless-tray" install-helper --dry-run
          ditto -c -k --keepParent "$app" target/dist/VLESS-Tray-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VLESS-Tray-macOS
          path: target/dist/VLESS-Tray-macOS.zip
          if-no-files-found: error
