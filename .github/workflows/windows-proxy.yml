name: Windows SOCKS proxy

on:
  pull_request:
  push:
    branches: [claude/sweet-tesla-xhzpgw]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p vless-profile
      - run: cargo build --locked --release -p vless-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: vless-proxy-windows-x64
          path: target/release/vless-proxy.exe
          if-no-files-found: error
