name: Desktop Profiles

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  profiles:
    if: github.event_name != 'push' || github.ref_type == 'tag' || github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
    strategy:
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false
      - run: cargo build --locked --release -p vless-desktop
      - name: Package desktop client and core
        run: |
          mkdir -p target/profiles
          ext=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then ext=.exe; fi
          ./desktop/desktop-core/build.sh "$PWD/target/profiles/reality-sing-box$ext"
          cp "target/release/vless-desktop$ext" target/profiles/
          cp desktop/desktop-core/LICENSE target/profiles/CORE-LICENSE
          cp desktop/src/desktop/fonts/OFL.txt target/profiles/
          ./target/profiles/reality-sing-box$ext version
          python3 desktop/tests/core_smoke.py "./target/profiles/reality-sing-box$ext"
      - name: Verify Windows TUN transfer and route cleanup
        if: runner.os == 'Windows'
        run: python3 desktop/tests/core_smoke.py ./target/profiles/reality-sing-box.exe --tun
      - name: Verify macOS TUN transfer and route cleanup
        if: runner.os == 'macOS'
        run: sudo -n "$(command -v python3)" desktop/tests/core_smoke.py ./target/profiles/reality-sing-box --tun
      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/profiles/* -DestinationPath target/VLESS-Profiles.zip
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          app="target/VLESS Profiles.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          mv target/profiles/{vless-desktop,reality-sing-box} "$app/Contents/MacOS/"
          mv target/profiles/{CORE-LICENSE,OFL.txt} "$app/Contents/Resources/"
          cp desktop/Info.plist "$app/Contents/"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app/Contents/MacOS/reality-sing-box"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" target/VLESS-Profiles.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VLESS-Profiles-${{ runner.os }}
          path: target/VLESS-Profiles.zip
